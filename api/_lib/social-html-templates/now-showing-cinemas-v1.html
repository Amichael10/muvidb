html,body{margin:0;background:#ececec;font-family:"Host Grotesk",Arial,sans-serif}
.stage{width:1254px;height:1254px;position:relative;overflow:hidden;background:#fff;color:#000}

/* top brand recreated as editable text + simple mark */
.brand{position:absolute;left:60px;top:55px;display:flex;align-items:center;gap:12px}
.mark{width:68px;height:68px;position:relative}
.mark i{position:absolute;width:37px;height:24px;border-radius:5px;transform-origin:center}

.mark i:nth-child(3){background:#666;left:31px;top:33px;transform:rotate(-48deg) skew(-10deg)}

.tag{font-size:10px;letter-spacing:4px;color:#ff5a1f;margin-top:10px}
.divider{height:74px;width:1px;background:#111;margin-left:34px}

.mantra span{color:#ff5a1f}
.dots{position:absolute;right:56px;top:39px;width:92px;height:82px;background-image:radial-gradient(#ff5a1f 1.6px,transparent 1.8px);background-size:27px 23px}

.copy{position:absolute;left:65px;top:199px;width:455px}
.badge{display:inline-block;background:#ff5a1f;color:#fff;border-radius:9px;padding:9px 15px 8px;font-size:29px;line-height:1}
.title{font-family:"Bebas Neue",sans-serif;font-size:112px;line-height:.88;margin-top:47px;letter-spacing:.5px}
.rule{width:170px;height:7px;background:#ff5a1f;margin-top:25px}
.desc{font-size:28px;line-height:1.45;margin-top:37px;width:470px}

.features{position:absolute;left:66px;top:711px;width:400px}
.feature{height:106px;display:grid;grid-template-columns:62px 1px 1fr;column-gap:14px;align-items:center}
.feature img{width:58px;height:58px;object-fit:contain}
.vline{height:70px;background:#ff5a1f}
.ftxt b{font-size:23px;display:block;margin-bottom:7px}
.ftxt span{font-size:22px}
.feature:not(:last-child) .ftxt{border-bottom:1px solid #ff5a1f;padding-bottom:14px}

.poster-bg{position:absolute;left:694px;top:117px;width:450px;height:1004px;background:#fae4c8;border-radius:38px;transform:rotate(7deg)}

.poster-mask img{width:100%;height:100%;object-fit:cover;display:block}

.footer-line{position:absolute;left:0;right:0;bottom:99px;height:2px;background:#ff5a1f}
.social{position:absolute;left:54px;bottom:31px;font-size:27px;letter-spacing:15px;white-space:nowrap}
.handle{letter-spacing:0;font-size:18px;margin-left:8px}
.footer-right{position:absolute;right:54px;bottom:25px;display:flex;align-items:center;gap:16px}
.globe{font-size:44px;color:#ff5a1f}
.footer-copy{font-size:17px;line-height:1.25}

/* Exact footer SVG set supplied by user */
.exact-footer-socials{
  position:absolute;
  left:53px;
  top:1191px;
  height:35px;
  display:flex;
  align-items:center;
  gap:19px;
}
.exact-social{
  width:27px;
  height:27px;
  flex:0 0 auto;
}
.exact-social svg{
  width:100%;
  height:100%;
  display:block;
}
.exact-footer-socials .handle{
  margin-left:8px;
  font-size:18px;
  font-weight:600;
  letter-spacing:0;
}
.exact-explore{
  position:absolute;
  right:50px;
  top:1180px;
  display:grid;
  grid-template-columns:58px 1fr;
  gap:16px;
  align-items:center;
}
.exact-globe{
  width:54px;
  height:54px;
}
.exact-globe svg{
  width:100%;
  height:100%;
  display:block;
}
.exact-explore .explore-copy{
  font-size:17px;
  line-height:1.28;
}
.exact-explore .explore-copy strong{
  color:#FF5A1F;
  font-weight:500;
}


/* Footer alignment fix: individual SVG icons must participate in the flex row */
.exact-footer-socials{
  position:absolute !important;
  left:53px !important;
  top:1191px !important;

  align-items:center !important;

}
.exact-footer-socials .exact-social{
  position:relative !important;
  left:auto !important;
  right:auto !important;
  top:auto !important;
  bottom:auto !important;
  width:27px !important;
  height:27px !important;
  display:block !important;
  flex:0 0 27px !important;
  letter-spacing:normal !important;
}
.exact-footer-socials .exact-social svg{

}
.exact-footer-socials .handle{
  position:relative !important;
  left:auto !important;
  top:auto !important;
  margin-left:8px !important;
  display:block !important;
  flex:0 0 auto !important;
}

</style>
