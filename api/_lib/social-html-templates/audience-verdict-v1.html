<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuviDB — Audience Pulse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&display=swap');
*{box-sizing:border-box}
:root{--brand:#ff6a1a;--ink:#07090c;--white:#fff}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:'Barlow',sans-serif}
.card{position:relative;width:100vw;height:100vh;overflow:hidden;color:var(--white);background:#0b0d10}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
/* Moodier than the editorial cards. The comment cards are white, so the still
   behind them has to sit back or everything fights. */
.shade{position:absolute;inset:0;z-index:1;background:
  radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.30),rgba(0,0,0,.66) 70%),
  linear-gradient(to bottom,rgba(0,0,0,.62),rgba(0,0,0,.34) 28%,rgba(0,0,0,.44) 70%,rgba(0,0,0,.82) 100%)}
.logo{position:absolute;left:4.2%;top:4%;width:29%;height:auto;z-index:6;
  filter:drop-shadow(0 .3vw 1vw rgba(0,0,0,.6))}

/* ---- comment cards ---- */
.comments{position:absolute;inset:0;z-index:4}
.comment{position:absolute;background:#fff;color:#0b0d10;border-radius:1.5vw;
  padding:1.35vw 1.5vw 1.1vw;box-shadow:0 1.2vw 3.2vw rgba(0,0,0,.45);
  border:.22vw solid var(--brand)}
.comment .head{display:flex;align-items:center;gap:.9vw}
.comment .pic{width:4.1vw;height:4.1vw;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#d9d9d9}
.comment .who{font-size:1.85vw;font-weight:700;color:#15181c;flex:1 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment .dots{flex:0 0 auto;color:#8b9099;font-size:2.1vw;line-height:.6;letter-spacing:.12em;font-weight:700}
.comment .what{margin-top:.75vw;font-size:2.35vw;line-height:1.24;font-weight:600;color:#14171b}
.comment .row{display:flex;gap:2.2vw;align-items:center;margin-top:1vw}
.comment .row svg{width:1.95vw;height:1.95vw;fill:none;stroke:#9aa0a8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.comment .row .heart svg{fill:#ff3b1f;stroke:#ff3b1f}
.c0{left:7.5%;top:13.5%;width:38%}
.c1{right:1.8%;top:20%;width:37%}
.c2{left:2.5%;top:68.5%;width:37%}
.c3{right:1.8%;top:68%;width:36%}
.c4{left:27%;top:83%;width:44%}

/* ---- the pulse block ---- */
.pulse{position:absolute;left:0;right:0;top:41.5%;z-index:5;text-align:center}
.label{display:inline-block;border:.26vw solid var(--brand);border-radius:10vw;
  padding:.75vw 2.6vw;font-size:1.95vw;font-weight:700;letter-spacing:.34em;
  text-transform:uppercase;color:#fff;text-shadow:0 .2vw .7vw rgba(0,0,0,.6)}
.figure{margin-top:.9vw;display:flex;align-items:center;justify-content:center;gap:0}
.bucket{width:16vw;height:16vw;margin-right:-1.6vw;margin-top:1.5vw;flex:0 0 auto;
  filter:drop-shadow(0 .6vw 1.4vw rgba(0,0,0,.6))}
.bucket svg{display:block;width:100%;height:100%}
.num{font-size:17vw;line-height:.82;font-weight:900;letter-spacing:-.045em;
  text-shadow:0 .5vw 1.6vw rgba(0,0,0,.72)}
.num .sign{color:var(--brand)}
.like{margin-top:-.6vw;font-size:7.4vw;line-height:1;font-weight:900;letter-spacing:.01em;
  text-shadow:0 .4vw 1.3vw rgba(0,0,0,.72)}
.swoosh{display:block;margin:.5vw auto 0;width:26vw;height:2.2vw}
.swoosh path{fill:none;stroke:var(--brand);stroke-width:7;stroke-linecap:round}
body.render-mode *{animation:none!important;transition:none!important}
</style>
</head>
<body>

.9 7.4c8.2-.1 6.7-10.9 2.4-9"/><path fill="#edd8b4" d="M23.2 18.8c-1.6 7.9 9.9 5 5.1-.8c-1-3.6-4.5-1.8-5.1.8"/><path fill="#c9ae81" d="M25.7 18.2c-.1 1.5-1.2.8-2 1.5c-2.3 2 3.9 3.9 4.9.3c.2-.9-2.6.1-2.1-1.4c.6-1.5-.6-1.7-.8-.4"/><path fill="#fff8d6" d="M45.3 9.3c.6-2.9-6.9-3.9-5.2 1.6c-4.9.4-2.3 9.7 2.8 7.2c2 3.3 6.8-.1 4.9-2.7c4.1-.9 1.8-7.9-2.5-6.1"/><path fill="#edd8b4" d="M41.8 11.9c-2-.7-3.4 3.1-.1 2.8c-1.3 2.4 3.9 4.1 3.3.4c3 1.2 3.7-3.6 1.1-3.9c-1.1-3.6-5.3-1.7-4.3.7"/><path fill="#c9ae81" d="M43.6 11.4c-.1 1.5-.2 1.3-1.2 1.3c-1.9.1-1.8 1.2 0 .8c1.1-.3 1.6-.2.9 1.2c-.8 1.7.5 1.6.7.1s0-.9 1.5-1.1c1.3-.2 1.4-1-.2-.8s-1.4.3-.9-1.2c.5-1.4-.7-1.6-.8-.3"/><path fill="#ed4c5c" d="M7.8 22.4L15.7 62h6.5l-5.3-39.6c-.4-5.6-9.9-5.6-9.1 0"/><path fill="#f9f9f9" d="M16.9 22.4L22.2 62h6.5L26 22.4c0-5.6-9.5-5.6-9.1 0"/><path fill="#ed4c5c" d="M26 22.4L28.7 62h6.5V22.4c.3-5.6-9.2-5.6-9.2 0"/><path fill="#f9f9f9" d="M35.2 22.4V62h6.4l2.7-39.6c.6-5.6-8.8-5.6-9.1 0"/><path fill="#c94747" d="m41.6 62l4.1-2.8l1.9-35.5c.6-4.3-3-5.9-3.4-1.3z"/><path fill="#e8e8e8" d="M49.2 56.8L51.1 25c.7-4-2.8-5.6-3.4-1.3l-1.9 35.5z"/><path fill="#c94747" d="m52.1 54.9l2.3-28.5c.8-3.7-2.6-5.3-3.3-1.3l-1.9 31.8z"/><path fill="#e8e8e8" d="m54 53.6l2.3-26c.2-2.9-1.6-3.9-1.9-1.2l-2.3 28.5z"/></symbol></svg>

<main class="card" id="card">
  <img class="art" id="art" alt="">
  <div class="shade"></div>
  <img class="logo" src="../../../public/images/MuviDB%20Brand/White%20Wordmark.svg" alt="MuviDB">

  <div class="comments" id="comments"></div>

  <div class="pulse">
    <span class="label" id="label">Audience Pulse</span>
    <div class="figure">
      <span class="bucket"><svg viewBox="0 0 64 64"><use href="#popcorn"/></svg></span>
      <span class="num" id="num"></span>
    </div>
    <div class="like" id="like">LIKE</div>
    <svg class="swoosh" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">
      <path d="M6 14C70 4 230 4 294 11"/>
    </svg>
  </div>
</main>
<script>
const DEFAULTS={label:'Audience Pulse',likeWord:'LIKE',image:'',likedPercent:null,comments:[]};

function icons(){
  return '<span><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3Z"/></svg></span>'
    + '<span><svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>'
    + '<span class="heart"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg></span>'
    + '<span><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg></span>';
}

// YouTube serves avatars at s48 by default, which is soft at this size.
function bigAvatar(url){
  return String(url||'').replace(/=s\d+-/,'=s176-');
}

function render(input={}){
  const d={...DEFAULTS,...(window.MUVIDB_DATA||{}),...input};
  document.getElementById('art').src=d.image||'';
  document.getElementById('label').textContent=d.label||'';
  document.getElementById('like').textContent=d.likeWord||'LIKE';

  const pct=Number(d.likedPercent);
  document.getElementById('num').innerHTML=
    Number.isFinite(pct)?`${Math.round(pct)}<span class="sign">%</span>`:'';

  const wrap=document.getElementById('comments');
  wrap.innerHTML='';
  (d.comments||[]).slice(0,5).forEach((c,i)=>{
    const el=document.createElement('div');
    el.className=`comment c${i}`;

    const head=document.createElement('div');head.className='head';
    const pic=document.createElement('img');pic.className='pic';pic.src=bigAvatar(c.avatar);pic.alt='';
    const who=document.createElement('div');who.className='who';who.textContent=c.author||'';
    const dots=document.createElement('div');dots.className='dots';dots.textContent='•••';
    head.appendChild(pic);head.appendChild(who);head.appendChild(dots);

    const what=document.createElement('div');what.className='what';
    const raw=String(c.body||'').replace(/\s+/g,' ').trim();
    what.textContent=raw.length>52?raw.slice(0,49).replace(/[\s,.;:!-]+$/,'')+'…':raw;

    const row=document.createElement('div');row.className='row';row.innerHTML=icons();
    el.appendChild(head);el.appendChild(what);el.appendChild(row);
    wrap.appendChild(el);
  });
}
const q=new URLSearchParams(location.search);
if(q.get('render')==='1')document.body.classList.add('render-mode');
render();
window.renderMuviDBCard=render;
window.addEventListener('message',e=>{if(e.data?.type==='MUVIDB_UPDATE_DATA')render(e.data.data)});
</script>
</body>
</html>
