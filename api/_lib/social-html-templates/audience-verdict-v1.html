<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuviDB — Audience Pulse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&display=swap');
*{box-sizing:border-box}
:root{--brand:#ff6a1a;--heart:#ff2d55;--ink:#07090c;--white:#fff}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:'Barlow',sans-serif}
.card{position:relative;width:100vw;height:100vh;overflow:hidden;color:var(--white);background:#0b0d10}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0}
/* The headline number sits on its own panel now, so the artwork only has to
   stay readable behind white cards rather than behind white text. */
.shade{position:absolute;inset:0;z-index:1;background:
  linear-gradient(to bottom,rgba(0,0,0,.52),rgba(0,0,0,.20) 26%,rgba(0,0,0,.34) 62%,rgba(0,0,0,.80) 100%)}
.logo{position:absolute;left:5%;top:4%;width:26%;height:auto;z-index:6;
  filter:drop-shadow(0 .3vw 1vw rgba(0,0,0,.65))}

/* ---- comment cards: a diagonal cascade, not scattered corners ---- */
.comments{position:absolute;inset:0;z-index:4}
.comment{position:absolute;background:#fff;color:#0b0d10;border-radius:1.6vw;
  padding:1.3vw 1.5vw 1.1vw;box-shadow:0 1.3vw 3.4vw rgba(0,0,0,.5)}
.comment .head{display:flex;align-items:center;gap:.85vw;margin-bottom:.6vw}
.comment .pic{width:3.8vw;height:3.8vw;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#dcdcdc}
.comment .who{font-size:1.8vw;font-weight:800;color:var(--brand);flex:1 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment .what{font-size:2.25vw;line-height:1.26;font-weight:600;color:#14171b}
/* A real like count, straight from YouTube. Far better proof than a
   per-comment percentage we cannot actually derive. */
.comment .likes{display:flex;align-items:center;gap:.7vw;margin-top:.9vw;
  font-size:2.3vw;font-weight:800;color:#15181c}
.comment .likes svg{width:2.5vw;height:2.5vw;fill:var(--heart);flex:0 0 auto}
.comment .likes.none{display:none}

/* Three quotes is the composition: the cascade has to finish above the panel,
   and a fourth card ran straight into it. */
.c0{left:7%;top:13%;width:45%}
.c1{left:30%;top:30%;width:46%}
.c2{left:16%;top:47%;width:45%}
/* Fewer quotes: spread them so the cascade still fills the frame. */
.n2 .c0{left:8%;top:16%;width:52%}.n2 .c1{left:28%;top:38%;width:52%}
.n1 .c0{left:11%;top:23%;width:58%}

/* ---- the verdict panel ---- */
.popcorn{position:absolute;left:1.5%;bottom:9%;width:30%;height:auto;z-index:6;
  filter:drop-shadow(0 .8vw 1.8vw rgba(0,0,0,.65))}
.popcorn svg{display:block;width:100%;height:100%}
.panel{position:absolute;right:4%;bottom:11.5%;left:22%;z-index:5;
  background:rgba(8,10,13,.92);border-radius:2.2vw;padding:2.1vw 2.6vw 1.7vw 9vw;
  box-shadow:0 1.4vw 4vw rgba(0,0,0,.55)}
.verdict{display:flex;align-items:baseline;gap:1.4vw}
.pct{font-size:9.6vw;line-height:.86;font-weight:900;letter-spacing:-.05em;color:var(--brand)}
.lede{font-size:4.1vw;line-height:1.02;font-weight:800;letter-spacing:-.02em;color:#fff}
.source{margin-top:1vw;font-size:1.55vw;font-weight:600;letter-spacing:.02em;color:#b9bec6}
body.render-mode *{animation:none!important;transition:none!important}
</style>
</head>
<body>

.9 7.4c8.2-.1 6.7-10.9 2.4-9"/><path fill="#edd8b4" d="M23.2 18.8c-1.6 7.9 9.9 5 5.1-.8c-1-3.6-4.5-1.8-5.1.8"/><path fill="#c9ae81" d="M25.7 18.2c-.1 1.5-1.2.8-2 1.5c-2.3 2 3.9 3.9 4.9.3c.2-.9-2.6.1-2.1-1.4c.6-1.5-.6-1.7-.8-.4"/><path fill="#fff8d6" d="M45.3 9.3c.6-2.9-6.9-3.9-5.2 1.6c-4.9.4-2.3 9.7 2.8 7.2c2 3.3 6.8-.1 4.9-2.7c4.1-.9 1.8-7.9-2.5-6.1"/><path fill="#edd8b4" d="M41.8 11.9c-2-.7-3.4 3.1-.1 2.8c-1.3 2.4 3.9 4.1 3.3.4c3 1.2 3.7-3.6 1.1-3.9c-1.1-3.6-5.3-1.7-4.3.7"/><path fill="#c9ae81" d="M43.6 11.4c-.1 1.5-.2 1.3-1.2 1.3c-1.9.1-1.8 1.2 0 .8c1.1-.3 1.6-.2.9 1.2c-.8 1.7.5 1.6.7.1s0-.9 1.5-1.1c1.3-.2 1.4-1-.2-.8s-1.4.3-.9-1.2c.5-1.4-.7-1.6-.8-.3"/><path fill="#ed4c5c" d="M7.8 22.4L15.7 62h6.5l-5.3-39.6c-.4-5.6-9.9-5.6-9.1 0"/><path fill="#f9f9f9" d="M16.9 22.4L22.2 62h6.5L26 22.4c0-5.6-9.5-5.6-9.1 0"/><path fill="#ed4c5c" d="M26 22.4L28.7 62h6.5V22.4c.3-5.6-9.2-5.6-9.2 0"/><path fill="#f9f9f9" d="M35.2 22.4V62h6.4l2.7-39.6c.6-5.6-8.8-5.6-9.1 0"/><path fill="#c94747" d="m41.6 62l4.1-2.8l1.9-35.5c.6-4.3-3-5.9-3.4-1.3z"/><path fill="#e8e8e8" d="M49.2 56.8L51.1 25c.7-4-2.8-5.6-3.4-1.3l-1.9 35.5z"/><path fill="#c94747" d="m52.1 54.9l2.3-28.5c.8-3.7-2.6-5.3-3.3-1.3l-1.9 31.8z"/><path fill="#e8e8e8" d="m54 53.6l2.3-26c.2-2.9-1.6-3.9-1.9-1.2l-2.3 28.5z"/></symbol></svg>

<main class="card" id="card">
  <img class="art" id="art" alt="">
  <div class="shade"></div>
  <img class="logo" src="../../../public/images/MuviDB%20Brand/White%20Wordmark.svg" alt="MuviDB">

  <div class="comments" id="comments"></div>

  <span class="popcorn"><svg viewBox="0 0 64 64"><use href="#popcorn"/></svg></span>
  <div class="panel">
    <div class="verdict">
      <span class="pct" id="pct"></span>
      <span class="lede" id="lede">Like<br>This Film</span>
    </div>
    <div class="source" id="source"></div>
  </div>
</main>
<script>
const DEFAULTS={lede:'Like<br>This Film',source:'Based on real viewer comments on YouTube',
  image:'',likedPercent:null,comments:[]};

// YouTube serves avatars at s48 by default, far too soft at this size.
function bigAvatar(url){ return String(url||'').replace(/=s\d+-/,'=s176-'); }

// 6757 -> "6.8K". Keeps the count readable without lying about it.
function shortCount(n){
  const v=Number(n)||0;
  if(v>=1000) return (v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,'')+'K';
  return String(v);
}

function heart(){
  return '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>';
}

function render(input={}){
  const d={...DEFAULTS,...(window.MUVIDB_DATA||{}),...input};
  document.getElementById('art').src=d.image||'';
  document.getElementById('lede').innerHTML=d.lede||DEFAULTS.lede;
  document.getElementById('source').textContent=d.source||'';

  const pct=Number(d.likedPercent);
  document.getElementById('pct').textContent=Number.isFinite(pct)?`${Math.round(pct)}%`:'';

  // Three is the cascade's capacity: a fourth card collides with the panel.
  const list=(d.comments||[]).slice(0,3);
  const wrap=document.getElementById('comments');
  wrap.className=`comments n${list.length}`;
  wrap.innerHTML='';

  list.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className=`comment c${i}`;

    const head=document.createElement('div');head.className='head';
    const pic=document.createElement('img');pic.className='pic';pic.src=bigAvatar(c.avatar);pic.alt='';
    const who=document.createElement('div');who.className='who';who.textContent=c.author||'';
    head.appendChild(pic);head.appendChild(who);

    const what=document.createElement('div');what.className='what';what.textContent=c.body||'';

    // Hidden rather than shown as "0" when a comment has no likes recorded.
    const likes=document.createElement('div');
    const n=Number(c.likes)||0;
    likes.className=n>0?'likes':'likes none';
    likes.innerHTML=`${heart()}<span>${shortCount(n)}</span>`;

    el.appendChild(head);el.appendChild(what);el.appendChild(likes);
    wrap.appendChild(el);
  });
}
const q=new URLSearchParams(location.search);
if(q.get('render')==='1')document.body.classList.add('render-mode');
render();
window.renderMuviDBCard=render;
window.addEventListener('message',e=>{if(e.data?.type==='MUVIDB_UPDATE_DATA')render(e.data.data)});
</script>
