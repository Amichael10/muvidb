<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MuviDB Craft Spotlight</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Bebas+Neue&display=swap');
  :root {
    --bg: #f5f3f0;
    --navy: #173f59;
    --orange: #ff5a1f;
    --ink: #111111;
  }

  * { box-sizing: border-box; }

  html, body.render-mode {
    padding: 0;
    margin: 0;
    background: transparent;
    display: block;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: #e8e8e8;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .canvas {
    width: 1280px;
    height: 1280px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
  }

  /* Header */
  .brand {
    position: absolute;
    top: 34px;
    left: 48px;
    width: 510px;
    height: 92px;
  }

  .brand img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: left center;
    display: block;
  }

  .dots {
    position: absolute;
    top: 38px;
    right: 63px;
    display: grid;
    grid-template-columns: repeat(8, 4px);
    gap: 16px 18px;
  }

  .dots i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--orange);
    display: block;
  }

  /* Right film-strip accent */
  .filmstrip {
    position: absolute;
    width: 94px;
    height: 776px;
    right: -54px;
    top: 313px;
    border-radius: 44px;
    background: #efdec6;
    transform: rotate(5deg);
    overflow: hidden;
    opacity: .95;
  }

  .filmstrip::after {
    content: "";
    position: absolute;
    left: 18px;
    top: 24px;
    width: 50px;
    height: 720px;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0 12px,
        rgba(255,255,255,.98) 12px 42px,
        transparent 42px 62px
      );
    border-radius: 18px;
  }

  /* Main grid */
  .main {
    position: absolute;
    left: 47px;
    right: 48px;
    top: 203px;
    height: 858px;
    display: grid;
    grid-template-columns: 465px 1fr;
    gap: 43px;
  }

  .left {
    min-width: 0;
  }

  .spotlight {
    width: 442px;
    height: auto;
    display: block;
  }

  .name {
    margin-top: 48px;
    line-height: .88;
    letter-spacing: -.035em;
    text-transform: uppercase;
    font-family: "Bebas Neue", "Arial Narrow", "Impact", sans-serif;
  }

  .name .first,
  .name .last {
    display: block;
    font-size: 109px;
    font-weight: 800;
  }

  .name .first { color: var(--navy); }
  .name .last {
    color: var(--orange);
    margin-top: 17px;
  }

  .accent-line {
    width: 181px;
    height: 4px;
    border-radius: 999px;
    background: var(--orange);
    margin-top: 29px;
  }

  .facts {
    margin-top: 65px;
    display: grid;
    gap: 38px;
  }

  .fact {
    display: grid;
    grid-template-columns: 66px 1px 1fr;
    gap: 18px;
    align-items: center;
    min-width: 0;
  }

  .fact img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    display: block;
  }

  .fact .divider {
    width: 1px;
    height: 51px;
    background: var(--orange);
  }

  .fact-copy {
    min-width: 0;
  }

  .fact-value {
    font-family: "Arial Narrow", "Impact", sans-serif;
    font-size: 31px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.02em;
  }

  .fact-label {
    margin-top: 7px;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 21px;
    line-height: 1.08;
  }

  .cta {
    width: 345px;
    height: 91px;
    margin-top: 67px;
    display: block;
  }

  /* Portrait */
  .portrait-frame {
    width: 100%;
    height: 850px;
    border-radius: 28px;
    overflow: hidden;
    background: #c8b49c;
  }

  .portrait-frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
  }

  /* Footer */
  .footer-rule {
    position: absolute;
    left: 43px;
    right: 44px;
    bottom: 123px;
    height: 2px;
    background: var(--orange);
  }

  .footer {
    position: absolute;
    left: 47px;
    right: 47px;
    bottom: 42px;
    display: flex;
    align-items: center;
  }

  .socials {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .socials img {
    width: 36px;
    height: 36px;
    display: block;
    object-fit: contain;
  }

  .handle {
    margin-left: 26px;
    font-size: 30px;
    line-height: 1;
    font-weight: 650;
    letter-spacing: -.02em;
  }

  /* Text protection for automation */
  [data-field] {
    overflow-wrap: anywhere;
  }

  .name.compact .first,
  .name.compact .last {
    font-size: 94px;
  }

  .name.tighter .first,
  .name.tighter .last {
    font-size: 82px;
  }
</style>
</head>

<script>
/*
  Social Studio dynamic data:

  window.MUVIDB_CRAFT_SPOTLIGHT = {
    nameLine1: "ADEDIMEJI",
    nameLine2: "LATEEF",
    creditsCount: 164,
    creditsLabel: "Verified Credits",
    nationality: "NIGERIAN",
    occupations: ["ACTOR", "DIRECTOR"],
    portrait: "https://your-image-url.jpg"
  };
*/

const DEFAULT_DATA = {
  nameLine1: "ADEDIMEJI",
  nameLine2: "LATEEF",
  creditsCount: "164",
  creditsLabel: "Verified Credits",
  nationality: "NIGERIAN",
  occupations: ["ACTOR", "DIRECTOR"],
  portrait: document.querySelector('[data-field-img="portrait"]')?.getAttribute('src') || ""
};

function fitName() {
  const box = document.getElementById("personName");
  if (!box) return;
  const line1 = document.querySelector('[data-field="nameLine1"]')?.textContent || "";
  const line2 = document.querySelector('[data-field="nameLine2"]')?.textContent || "";
  const total = line1.length + line2.length;

  box.classList.remove("compact", "tighter");
  if (total > 20) box.classList.add("compact");
  if (total > 27) {
    box.classList.remove("compact");
    box.classList.add("tighter");
  }
}

function getInitialData() {
  const q = new URLSearchParams(window.location.search);
  if (q.get('render') === '1') {
    document.body.classList.add('render-mode');
  }
  let d = {};
  if (window.MUVIDB_DATA) {
    d = window.MUVIDB_DATA;
  } else if (window.MUVIDB_CRAFT_SPOTLIGHT) {
    d = window.MUVIDB_CRAFT_SPOTLIGHT;
  } else if (q.get('data')) {
    try {
      d = JSON.parse(decodeURIComponent(escape(atob(q.get('data')))));
    } catch(e) {
      try {
        d = JSON.parse(atob(q.get('data')));
      } catch(e2) {}
    }
  }
  return d;
}

function renderCraftSpotlight(overrides = {}) {
  const initial = getInitialData();
  const raw = Object.assign(
    {},
    DEFAULT_DATA,
    initial || {},
    window.MUVIDB_DATA || {},
    window.MUVIDB_CRAFT_SPOTLIGHT || {},
    overrides || {}
  );

  let nameLine1 = raw.nameLine1 ?? raw.firstName ?? "";
  let nameLine2 = raw.nameLine2 ?? raw.lastName ?? "";
  if (!nameLine1 && !nameLine2 && raw.name) {
    const parts = String(raw.name).trim().split(/\s+/);
    nameLine1 = parts[0] || "";
    nameLine2 = parts.slice(1).join(" ") || "";
  }

  const creditsCount = raw.creditsCount ?? raw.creditCount ?? raw.credits ?? DEFAULT_DATA.creditsCount;
  const creditsLabel = raw.creditsLabel ?? DEFAULT_DATA.creditsLabel;
  const nationality = raw.nationality ?? raw.country ?? DEFAULT_DATA.nationality;
  const occupationsRaw = raw.occupations ?? raw.roles ?? raw.department ?? raw.knownForDepartment ?? raw.known_for_department ?? DEFAULT_DATA.occupations;
  const portrait = raw.portrait ?? raw.photo ?? raw.photoUrl ?? raw.photoCutoutUrl ?? raw.backdropUrl ?? raw.posterUrl ?? raw.poster ?? "";
  const handle = raw.handle ?? "@muvidb_";

  const elNameLine1 = document.querySelector('[data-field="nameLine1"]');
  if (elNameLine1) elNameLine1.textContent = nameLine1;
  const elNameLine2 = document.querySelector('[data-field="nameLine2"]');
  if (elNameLine2) elNameLine2.textContent = nameLine2;

  const elCreditsCount = document.querySelector('[data-field="creditsCount"]');
  if (elCreditsCount) elCreditsCount.textContent = creditsCount;
  const elCreditsLabel = document.querySelector('[data-field="creditsLabel"]');
  if (elCreditsLabel) elCreditsLabel.textContent = creditsLabel;

  const elNationality = document.querySelector('[data-field="nationality"]');
  if (elNationality) elNationality.textContent = String(nationality).toUpperCase();

  const occupations = Array.isArray(occupationsRaw)
    ? occupationsRaw
    : String(occupationsRaw)
        .split(/[,.|•]/)
        .map(v => v.trim())
        .filter(Boolean);

  const elOccupations = document.querySelector('[data-field="occupations"]');
  if (elOccupations) {
    elOccupations.textContent = occupations
      .slice(0, 3)
      .map(v => v.toUpperCase())
      .join(" . ");
  }

  const portraitEl = document.querySelector('[data-field-img="portrait"]');
  if (portraitEl) {
    const src = portrait || DEFAULT_DATA.portrait;
    if (src) {
      portraitEl.crossOrigin = "anonymous";
      portraitEl.src = src;
    }
  }

  const handleEl = document.querySelector('[data-field="handle"]') || document.getElementById("handle") || document.querySelector(".handle");
  if (handleEl) handleEl.textContent = handle;

  fitName();
}

window.renderCraftSpotlight = renderCraftSpotlight;
window.renderMuviDBCard = renderCraftSpotlight;
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'MUVIDB_UPDATE_DATA') {
    renderCraftSpotlight(event.data.data);
  }
});
renderCraftSpotlight();
</script>
