name: Social Post Preflight

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: social-post-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: 'https://muvidb.com'
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Recheck posts due in twenty minutes
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$BASE_URL/api/cron/sync?task=social_preflight"
