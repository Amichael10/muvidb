name: Daily People Consensus and Cleanup

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_run:
    workflows: ["Continuous YouTube Sync"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running cleanup'
        required: false
        default: 'Manual on-demand run'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run People Consensus & Cleanup
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/daily_people_cleanup.ts
