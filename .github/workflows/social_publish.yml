name: Social Publisher & Daily Planning

on:
  # Cron triggers moved to Cloudflare Worker (muvidb-cron-worker) to eliminate
  # GitHub Actions queue delays and stop burning Vercel 4-hour compute limits.
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  #   - cron: '0 23 * * *'
  #   - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to execute'
        required: true
        default: social_publish
        type: choice
        options:
          - social_publish
          - daily_social_schedule
          - morning_briefing
          - social_prune_assets

# Never let two queue drainers publish the same batch concurrently. The database
# publisher also claims each job atomically and uses idempotency keys.
concurrency:
  group: social-studio-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-social-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Verify publisher secret
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Determine task to run
        id: task_select
        shell: bash
        run: |
          # Manual dispatch wins.
          if [ -n "${{ inputs.task }}" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled runs are routed by the cron expression that fired, so a
          # delayed runner cannot fall through to the wrong task.
          case "${{ github.event.schedule }}" in
            '0 23 * * *') echo "task=daily_social_schedule" >> "$GITHUB_OUTPUT" ;;
            '0 6 * * *')  echo "task=morning_briefing"      >> "$GITHUB_OUTPUT" ;;
            *)            echo "task=social_publish"        >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Execute social task
        shell: bash
        run: |
          TASK="${{ steps.task_select.outputs.task }}"
          ENDPOINT="https://muvidb.com/api/cron/sync?task=$TASK"
          echo "Executing task: $TASK ($ENDPOINT)"

          response="$(curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            --max-time 240 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$ENDPOINT")"

          echo "$response" | jq .

          if [ "$(echo "$response" | jq -r '.skipped // false')" = "true" ]; then
            reason="$(echo "$response" | jq -r '.reason // "unknown reason"')"
            echo "::error::Social operation was skipped: $reason"
            exit 1
          fi

          echo "Task $TASK executed successfully."
