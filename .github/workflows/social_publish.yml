name: Social Studio Publisher

on:
  schedule:
    # MuviDB normally publishes twice daily. GitHub cron uses UTC; Lagos is UTC+1.
    - cron: "0 8 * * *"   # 09:00 Africa/Lagos
    - cron: "30 14 * * *" # 15:30 Africa/Lagos
  workflow_dispatch:

# Never let two queue drainers publish the same batch concurrently. The
# database publisher also claims each job atomically and uses idempotency keys.
concurrency:
  group: social-studio-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-due-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISH_URL: https://muvidb.com/api/cron/sync?task=social_publish
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.VITE_CRON_SECRET }}

    steps:
      - name: Verify publisher secret
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Publish due Social Studio posts
        shell: bash
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            --max-time 240 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$PUBLISH_URL")"

          echo "$response" | jq .

          if [ "$(echo "$response" | jq -r '.skipped // false')" = "true" ]; then
            reason="$(echo "$response" | jq -r '.reason // "unknown reason"')"
            echo "::error::Social publisher was skipped: $reason"
            exit 1
          fi

          processed="$(echo "$response" | jq -r '.processed // 0')"
          echo "Social Studio publisher completed. Jobs processed: $processed"
