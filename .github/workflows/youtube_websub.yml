name: YouTube Upload Notification Maintenance

on:
  schedule:
    # Renew expiring WebSub leases once daily, away from the top of the hour.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task to run
        required: true
        default: renew
        type: choice
        options:
          - renew

concurrency:
  group: youtube-upload-notification-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain-youtube-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://muvidb.com
      CRON_SECRET: ${{ secrets.VITE_CRON_SECRET }}

    steps:
      - name: Verify maintenance secret
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::VITE_CRON_SECRET is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Renew WebSub subscriptions
        shell: bash
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 2 --retry-all-errors --max-time 240 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$BASE_URL/api/automation?action=youtube-websub-renew")"
          echo "$response" | jq .
          failed="$(echo "$response" | jq -r '.failed // 0')"
          total="$(echo "$response" | jq -r '.channels // 0')"
          if [ "$failed" -gt 0 ]; then
            if [ "$failed" -ge "$total" ] && [ "$total" -gt 0 ]; then
              echo "::error::All $failed YouTube WebSub subscription requests failed."
              exit 1
            else
              echo "::warning::$failed out of $total YouTube WebSub subscription request(s) failed."
            fi
          fi
