name: Streaming Platforms Sync

on:
  schedule:
    - cron: '0 2 * * 0,3' # 2:00 AM every Sunday and Wednesday
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run Netflix Sync
        id: netflix
        continue-on-error: true
        run: npm run scrape:netflix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NETFLIX_EMAIL: ${{ secrets.NETFLIX_EMAIL }}
          NETFLIX_PASSWORD: ${{ secrets.NETFLIX_PASSWORD }}
          NETFLIX_NO_PROXY: 'true'
          # A session captured from a real browser. Netflix blocks automated
          # logins, so without this the scraper browses logged out.
          NETFLIX_SESSION_STATE: ${{ secrets.NETFLIX_SESSION_STATE }}
          
      - name: Run Prime Sync
        id: prime
        continue-on-error: true
        run: npm run scrape:prime
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRIME_EMAIL: ${{ secrets.PRIME_EMAIL }}
          PRIME_PASSWORD: ${{ secrets.PRIME_PASSWORD }}
          
      - name: Run Feed Zeta Sync
        id: feedzeta
        continue-on-error: true
        run: npm run scrape:docuth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_ZETA_URL: ${{ secrets.FEED_ZETA_URL }}

      - name: Run Circuits Sync
        id: circuits
        continue-on-error: true
        run: npm run sync:circuits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CIRCUITS_EMAIL: ${{ secrets.CIRCUITS_EMAIL }}
          CIRCUITS_PASSWORD: ${{ secrets.CIRCUITS_PASSWORD }}

      # Each platform runs independently: a broken Netflix scraper must not stop
      # Prime, Feed Zeta or Circuits from syncing, which is what would happen
      # with the default fail-fast behaviour. This final step still turns the
      # run red so a dead scraper cannot sit unnoticed for weeks.
      - name: Report sync outcomes
        if: always()
        run: |
          failed=""
          [ "${{ steps.netflix.outcome }}"  = "failure" ] && failed="$failed netflix"
          [ "${{ steps.prime.outcome }}"    = "failure" ] && failed="$failed prime"
          [ "${{ steps.feedzeta.outcome }}" = "failure" ] && failed="$failed feed-zeta"
          [ "${{ steps.circuits.outcome }}" = "failure" ] && failed="$failed circuits"
          if [ -n "$failed" ]; then
            echo "::error::Streaming syncs failed:$failed"
            exit 1
          fi
          echo "All streaming syncs completed."
