services:
  - type: web
    name: muvidb-media-extractor
    env: python
    rootDir: services/media-extractor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: EXTRACTOR_SECRET
        generateValue: true
