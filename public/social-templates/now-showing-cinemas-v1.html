<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MuviDB — Now On Template</title>
<style>
  :root {
    --brand-orange: #ff4f1f;
    --ink: #111315;
    --muted: #7c7c7c;
    --paper: #fbfaf7;
    --line: #ff5a2b;
    --platform-color: #004baf;
    --platform-contrast: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #e9e9e9;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background:
      radial-gradient(circle at 72% 24%, rgba(255,105,58,.035), transparent 24%),
      var(--paper);
    color: var(--ink);
  }

  .header {
    position: absolute;
    left: 48px;
    right: 66px;
    top: 34px;
    height: 112px;
    display: flex;
    align-items: flex-start;
  }

  .brand {
    width: 286px;
    height: 76px;
    object-fit: contain;
    object-position: left top;
  }

  .header-rule {
    height: 70px;
    width: 1px;
    background: rgba(17,19,21,.68);
    margin: 6px 26px 0 18px;
  }

  .brand-verb {
    margin-top: 4px;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.18;
    letter-spacing: -.01em;
  }
  .brand-verb span::after { content: "."; color: var(--brand-orange); }

  .dot-grid {
    margin-left: auto;
    display: grid;
    grid-template-columns: repeat(8, 4px);
    gap: 13px 17px;
    padding-top: 6px;
  }
  .dot-grid i {
    width: 4px;
    height: 4px;
    background: var(--brand-orange);
    border-radius: 50%;
    display: block;
  }

  .content {
    position: absolute;
    left: 60px;
    right: 70px;
    top: 150px;
    bottom: 130px;
    display: grid;
    grid-template-columns: 410px 1fr;
    gap: 40px;
    align-items: stretch;
  }

  .info {
    padding-top: 56px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .title {
    margin: 0;
    max-width: 400px;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-size: 74px;
    line-height: .98;
    letter-spacing: -4px;
    font-weight: 950;
    color: #183e52;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }

  .platform-block {
    margin-top: 60px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
  }

  .now-on {
    display: inline-flex;
    align-items: center;
    padding: 11px 15px 12px;
    border-radius: 6px;
    background: var(--platform-color);
    color: var(--platform-contrast);
    font-size: 25px;
    line-height: 1;
    letter-spacing: -.02em;
    font-weight: 500;
  }

  .platform-logo-box {
    width: 290px;
    height: 94px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .platform-logo {
    display: block;
    max-width: 285px;
    max-height: 86px;
    width: auto;
    height: auto;
    object-fit: contain;
    object-position: left center;
  }

  .meta {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 24px;
    letter-spacing: -.02em;
  }
  .meta .sep {
    color: var(--brand-orange);
    font-size: 20px;
    transform: translateY(-1px);
  }

  .synopsis {
    margin-top: 44px;
    max-width: 360px;
    font-size: 28px;
    line-height: 1.35;
    font-weight: 650;
    letter-spacing: -.028em;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .learn {
    margin-top: auto;
    padding-bottom: 10px;
  }
  .learn-more-asset {
    display: block;
    width: 311px;
    height: 64px;
    object-fit: contain;
    object-position: left center;
  }


  .poster-wrap {
    position: relative;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding-top: 0;
  }
  .poster {
    width: 510px;
    height: 806px;
    object-fit: cover;
    object-position: center;
    border-radius: 18px;
    display: block;
    background: #dedede;
  }

  .filmstrip-asset {
    position: absolute;
    top: 264px;
    right: -12px;
    width: 58px;
    height: 584px;
    object-fit: fill;
    z-index: 0;
    pointer-events: none;
  }


  .footer-rule {
    position: absolute;
    left: 60px;
    right: 70px;
    bottom: 102px;
    height: 1.6px;
    background: var(--line);
  }

  .footer {
    position: absolute;
    left: 60px;
    right: 70px;
    bottom: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 16px;
  }
  .social {
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 650;
  }
  .social-icon {
    display: block;
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex: none;
  }
  .social-icon.facebook,
  .social-icon.tiktok,
  .social-icon.threads {
    width: 26px;
    height: 26px;
  }
  .handle { margin-left: 4px; }
  .footer-cta {
    font-size: 16px;
    font-weight: 700;
  }
  .footer-cta::after {
    content: ".";
    color: var(--brand-orange);
  }

  /* Useful when longer titles appear */
  .title.medium { font-size: 65px; letter-spacing: -3.4px; }
  .title.long { font-size: 56px; letter-spacing: -2.7px; }

  @media (max-width: 1120px) {
    body { padding: 0; }
    .canvas {
      transform-origin: top left;
      width: 1080px;
      height: 1080px;
    }
  }
</style>
</head>

const DEFAULT_DATA = {
  title: "My Bestie",
  poster: "",
  platform: "Docuth",
  year: "",
  genres: [],
  synopsis: "The story about two friends who do almost everything together."
};

function platformKey(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");
}

function platformKey(val) {
  return String(val || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

function normalizePlatform(value) {
  const key = platformKey(value);
  if (key.includes('docuth')) return 'docuth';
  if (key.includes('ebony')) return 'ebonyonplus';
  if (key.includes('kav')) return 'kava';
  if (key.includes('circuit')) return 'circuits';
  if (key.includes('nollie')) return 'nolliestream';
  if (key.includes('netflix')) return 'netflix';
  if (key.includes('prime') || key.includes('amazon')) return 'primevideo';
  const aliases = {
    docuth: "docuth",
    ebonyonplus: "ebonyonplus",
    ebonyplus: "ebonyonplus",
    ebonylife: "ebonyonplus",
    ebonylifeon: "ebonyonplus",
    kava: "kava",
    kavaapp: "kava",
    circuits: "circuits",
    circuit: "circuits",
    circuittv: "circuits",
    nolliestream: "nolliestream",
    nollistream: "nolliestream",
    netflix: "netflix",
    primevideo: "primevideo",
    amazonprimevideo: "primevideo",
    prime: "primevideo"
  };
  return aliases[key] || "docuth";
}

function hexToContrast(hex) {
  const clean = hex.replace("#", "");
  const r = parseInt(clean.slice(0, 2), 16);
  const g = parseInt(clean.slice(2, 4), 16);
  const b = parseInt(clean.slice(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b);
  return lum > 165 ? "#111315" : "#ffffff";
}

function clampSynopsis(text, max = 63) {
  const clean = String(text || "").trim().replace(/\s+/g, " ");
  if (clean.length <= max) return clean;
  const limit = Math.max(1, max - 1);
  let cut = clean.slice(0, limit);
  const lastSpace = cut.lastIndexOf(" ");
  if (lastSpace > Math.floor(limit * 0.66)) cut = cut.slice(0, lastSpace);
  return cut.replace(/[\s,.;:!?-]+$/g, "") + "…";
}

function fitTitle(titleEl, title) {
  titleEl.classList.remove("medium", "long");
  const n = String(title || "").length;
  if (n > 22) titleEl.classList.add("long");
  else if (n > 13) titleEl.classList.add("medium");
}

function getQueryData() {
  try {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('data');
    if (raw) {
      try {
        return JSON.parse(decodeURIComponent(escape(atob(raw))));
      } catch {
        return JSON.parse(decodeURIComponent(raw));
      }
    }
  } catch (e) {
    console.error('Error decoding query data:', e);
  }
  return null;
}

function renderMuviDBCard(overrides = {}) {
  const queryData = getQueryData();
  const data = Object.assign(
    {},
    DEFAULT_DATA,
    queryData || {},
    window.MUVIDB_DATA || {},
    window.MUVIDB_CARD_DATA || {},
    overrides || {}
  );
  const pKey = normalizePlatform(data.platform || data.watchAvailability || data.badge);
  const platform = PLATFORMS[pKey] || PLATFORMS["docuth"];

  const titleEl = document.querySelector('[data-field="title"]');
  if (titleEl) {
    titleEl.textContent = data.title || "";
    fitTitle(titleEl, data.title);
  }

  const metaEl = document.querySelector('.meta');
  const yearEl = document.querySelector('[data-field="year"]');
  const sepEl = document.querySelector('.sep');
  const genresEl = document.querySelector('[data-field="genres"]');

  const yearText = (data.year !== undefined && data.year !== null && data.year !== "") ? String(data.year).trim() : "";
  const genresList = Array.isArray(data.genres)
    ? data.genres.filter(Boolean).slice(0, 2)
    : String(data.genres || "").split(/[,|•]/).map(s => s.trim()).filter(Boolean).slice(0, 2);
  const genresText = genresList.join(" • ");

  if (yearEl) yearEl.textContent = yearText;
  if (genresEl) genresEl.textContent = genresText;
  if (sepEl) {
    sepEl.style.display = (yearText && genresText) ? "inline" : "none";
  }
  if (metaEl) {
    metaEl.style.display = (yearText || genresText) ? "flex" : "none";
  }

  const posterEl = document.querySelector('[data-field="poster"]');
  if (posterEl) {
    const posterSrc = data.poster || data.poster_url || data.backdrop_url || data.photo_url || data.posterUrl || DEFAULT_DATA.poster || "";
    if (posterSrc) {
      posterEl.crossOrigin = "anonymous";
      posterEl.src = posterSrc;
      posterEl.style.display = "block";
    } else {
      posterEl.removeAttribute("src");
      posterEl.style.display = "none";
    }
    posterEl.alt = (data.title || "Movie") + " poster";
  }

  const synopsisEl = document.querySelector('[data-field="synopsis"]');
  if (synopsisEl) {
    synopsisEl.textContent = clampSynopsis(data.synopsis || data.description, 63);
  }

  const logoEl = document.querySelector('[data-field="platform-logo"]');
  if (logoEl) {
    logoEl.src = platform.logo;
    logoEl.alt = platform.display;
  }

  document.documentElement.style.setProperty("--platform-color", platform.color);
  document.documentElement.style.setProperty("--platform-contrast", hexToContrast(platform.color));
}

window.MUVIDB_PLATFORMS = PLATFORMS;
window.renderMuviDBCard = renderMuviDBCard;
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'MUVIDB_UPDATE_DATA') {
    renderMuviDBCard(event.data.data);
  }
});
renderMuviDBCard();
</script>
</body>
